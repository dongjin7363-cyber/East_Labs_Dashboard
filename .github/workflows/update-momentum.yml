name: Update Momentum Dashboard

on:
  schedule:
    # 17:00 KST = 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-momentum:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update momentum dashboard
        run: python scripts/momentum/run_momentum_update.py

      - name: Commit and push dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/momentum/latest

          if git diff --cached --quiet; then
            echo "No momentum dashboard changes to commit."
            exit 0
          fi

          git commit -m "Update momentum dashboard"
          git push
