name: Market US Sector ETF Trend

on:
  schedule:
    - cron: "0 22 * * *" # KST 07:00 = UTC previous day 22:00
  workflow_dispatch:

jobs:
  run-us-sector-etf-trend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_market.txt ]; then
            pip install -r requirements_market.txt
          else
            pip install requests
          fi

      - name: Run US Sector ETF Trend script
        run: python3 scripts/market/us_sector_etf_trend.py
